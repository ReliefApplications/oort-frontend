<!-- Widget header -->
<ng-template #headerTemplate>
  <span class="widget-title" [title]="settings.title">{{
    settings.title
  }}</span>
</ng-template>

<!-- Loading indicator -->
<ui-spinner
  class="flex justify-center items-center !h-full"
  *ngIf="loading"
></ui-spinner>
<ng-container *ngIf="!loading && form">
  <!-- Embedded form -->
  <shared-form
    [form]="form"
    [floatingActions]="floatingActions"
    [record]="record"
    [mapQuestionState]="mapQuestionState"
    [mode]="mode"
    (save)="onComplete($event)"
  ></shared-form>
  <!-- New record button -->
  <ng-container *ngIf="completed && !form.uniqueRecord && !hideNewRecord">
    <ui-button category="secondary" (click)="clearForm()" class="mt-2 m-auto">{{
      'models.record.new' | translate
    }}</ui-button>
  </ng-container>
</ng-container>

<ng-template #completionPopupTemplate let-data>
  <ui-dialog size="medium">
    <ng-container ngProjectAs="header">
      <h3 *ngIf="data?.title" class="font-semibold">{{ data.title }}</h3>
    </ng-container>
    <ng-container ngProjectAs="content">
      <p class="text-sm text-gray-500">{{ data?.text }}</p>
    </ng-container>
  </ui-dialog>
</ng-template>
